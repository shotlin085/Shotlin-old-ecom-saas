name: Deploy to VPS

on:
  push:
    branches:
      - main  # Trigger deployment on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        run: |
                ssh -o StrictHostKeyChecking=no shotlin@139.59.23.210 "
                set -x &&
                cd /home/shotlin/shotlin-web &&
                git pull &&
                npm install &&
                npm run build &&
                echo "Sayanm@0912Sa" | sudo -S rm -rf /var/www/html/*
                echo "Sayanm@0912Sa" | sudo -S mv dist/assets dist/index.html dist/vite.svg /var/www/html/
                "
